name: Wreckingball
options:
  bundleIdPrefix: coops
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts.git
    from: "2.0.0"

targets:
  Wreckingball:
    type: application
    platform: macOS
    sources:
      - Wreckingball
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: Wreckingball/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleURLName: coops.wreckingball
            CFBundleURLSchemes: [wreckingball]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: coops.wreckingball
        PRODUCT_NAME: Wreckingball
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: HGQW7A6TH6
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Wreckingball/Wreckingball.entitlements
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Wreckingball
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Daniel Cooper. Licensed under the GNU GPL v3."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        INFOPLIST_KEY_NSCameraUsageDescription: "Wreckingball shows your camera in the recordings you make."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Wreckingball records your microphone into the recordings you make."
        MACOSX_DEPLOYMENT_TARGET: "15.0"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
